<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Junior Auditor — Printable Case Sheets</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="print-body">
    <div class="print-toolbar no-print">
      <a href="index.html">← Back to web app</a>
      <button onclick="window.print()">🖨️ Print all 4 cases</button>
    </div>
    <main id="print-root"></main>

    <script type="module">
      import { jobs } from './js/cases.js';

      const auditor = jobs.find((j) => j.id === 'junior-auditor');
      const root = document.getElementById('print-root');

      function esc(s) {
        return String(s)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;');
      }

      root.innerHTML = auditor.cases
        .map(
          (c, i) => `
        <section class="paper">
          <div class="paper-header">
            <div class="paper-job">Junior Auditor — Public Accounting</div>
            <div class="paper-case">Case ${i + 1}</div>
          </div>
          <h1 class="paper-title">${esc(c.title)}</h1>

          <div class="paper-name-row">
            Name: <span class="line long"></span>
            Date: <span class="line short"></span>
          </div>

          <section class="paper-scenario">
            <h2>Your mission</h2>
            <p>${esc(c.scenario)}</p>
          </section>

          <ol class="paper-questions">
            ${c.questions
              .map(
                (q) => `
              <li>
                <div class="paper-visit">🚶 Go visit the <strong>${esc(
                  q.visit,
                )}</strong> table</div>
                <div class="paper-prompt">${esc(q.prompt)}</div>
                <ul class="paper-options">
                  ${q.options
                    .map(
                      (opt, j) =>
                        `<li><span class="bubble">${String.fromCharCode(
                          65 + j,
                        )}</span> ${esc(opt)}</li>`,
                    )
                    .join('')}
                </ul>
              </li>`,
              )
              .join('')}
          </ol>

          <div class="paper-footer">
            Bring this sheet back to the Junior Auditor table when done!
          </div>
        </section>`,
        )
        .join('');
    </script>
  </body>
</html>
